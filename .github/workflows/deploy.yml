name: Deploy AI Agent Evaluation Function

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './backend/AiAgentEvaluation'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      
    - name: Build
      run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      
    - name: Run Unit Tests
      run: dotnet test ./backend/tests/AiAgentEvaluation.UnitTests/AiAgentEvaluation.UnitTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=unit-tests.trx"
      
    - name: Run Integration Tests
      run: dotnet test ./backend/tests/AiAgentEvaluation.IntegrationTests/AiAgentEvaluation.IntegrationTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=integration-tests.trx"
      
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: '**/TestResults/*.trx'
        reporter: dotnet-trx
        
    - name: Publish Function App
      run: dotnet publish --configuration ${{ env.BUILD_CONFIGURATION }} --output ./publish
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      
    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: function-app
        path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/publish

  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Validate Bicep Template
      run: |
        az deployment group validate \
          --resource-group ${{ secrets.AZURE_RG_NAME }} \
          --template-file ./backend/infrastructure/main.bicep \
          --parameters ./backend/infrastructure/main.parameters.${{ github.event.inputs.environment || 'dev' }}.json
      
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-infrastructure]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment:
      name: development
      url: ${{ steps.deploy-function.outputs.function-url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: function-app
        path: ./publish
        
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}
        
    - name: Deploy Infrastructure
      run: |
        az deployment group create \
          --resource-group ${{ secrets.AZURE_RG_DEV }} \
          --template-file ./backend/infrastructure/main.bicep \
          --parameters ./backend/infrastructure/main.parameters.dev.json \
          --parameters functionAppName=${{ secrets.FUNCTION_APP_NAME_DEV }}
          
    - name: Deploy Function App
      id: deploy-function
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ secrets.FUNCTION_APP_NAME_DEV }}
        package: ./publish
        
    - name: Validate Deployment
      run: |
        # Wait for function app to be ready
        sleep 30
        
        # Test health endpoint (to be implemented)
        # curl -f ${{ steps.deploy-function.outputs.function-url }}/api/health || exit 1
        
    - name: Run Smoke Tests
      run: |
        # Run subset of integration tests against dev environment
        echo "Smoke tests would run here"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-infrastructure]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.deploy-function.outputs.function-url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: function-app
        path: ./publish
        
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
        
    - name: Deploy Infrastructure
      run: |
        az deployment group create \
          --resource-group ${{ secrets.AZURE_RG_STAGING }} \
          --template-file ./backend/infrastructure/main.bicep \
          --parameters ./backend/infrastructure/main.parameters.staging.json \
          --parameters functionAppName=${{ secrets.FUNCTION_APP_NAME_STAGING }}
          
    - name: Deploy Function App
      id: deploy-function
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ secrets.FUNCTION_APP_NAME_STAGING }}
        package: ./publish
        
    - name: Validate Deployment
      run: |
        sleep 30
        # Add health check validation
        
    - name: Run Integration Tests
      run: |
        # Run full integration test suite against staging
        echo "Integration tests would run here"
        
    - name: Performance Validation
      run: |
        # Run performance tests with 1K test cases
        echo "Performance validation would run here"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment:
      name: production
      url: ${{ steps.deploy-function.outputs.function-url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: function-app
        path: ./publish
        
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
        
    - name: Create Deployment Slot
      run: |
        # Deploy to staging slot first
        az functionapp deployment slot create \
          --resource-group ${{ secrets.AZURE_RG_PROD }} \
          --name ${{ secrets.FUNCTION_APP_NAME_PROD }} \
          --slot staging
          
    - name: Deploy Infrastructure
      run: |
        az deployment group create \
          --resource-group ${{ secrets.AZURE_RG_PROD }} \
          --template-file ./backend/infrastructure/main.bicep \
          --parameters ./backend/infrastructure/main.parameters.prod.json \
          --parameters functionAppName=${{ secrets.FUNCTION_APP_NAME_PROD }}
          
    - name: Deploy to Staging Slot
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ secrets.FUNCTION_APP_NAME_PROD }}
        package: ./publish
        slot-name: staging
        
    - name: Validate Staging Slot
      run: |
        sleep 60
        # Run smoke tests against staging slot
        echo "Validating staging slot"
        
    - name: Swap to Production
      run: |
        # Swap staging slot to production
        az functionapp deployment slot swap \
          --resource-group ${{ secrets.AZURE_RG_PROD }} \
          --name ${{ secrets.FUNCTION_APP_NAME_PROD }} \
          --slot staging \
          --target-slot production
          
    - name: Post-Deployment Validation
      id: deploy-function
      run: |
        sleep 30
        # Validate production deployment
        echo "Production deployment validated"
        
    - name: Monitor for Issues
      run: |
        # Monitor Application Insights for errors
        echo "Monitoring for 5 minutes..."
        sleep 300
        # Check error rate, if >5% trigger rollback alert

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Send Notification
      run: |
        echo "Deployment completed. Status: ${{ job.status }}"
        # Add Teams/Slack notification here
